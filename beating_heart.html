<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- <meta
      name="viewport"
      content="width=
    , initial-scale=1.0"
    /> -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>Beating Heart</title>
    <style>
      /*
       * Animation: beat
       * Purpose: Creates a pulsing effect with rotation and shadow changes to simulate a heartbeat.
       *
       * Keyframes:
       * - 0%: Normal scale, rotated 225deg.
       * - 50%: Scaled up (1.1), rotated 225deg, larger shadow.
       * - 100%: Return to start.
       */
      @-webkit-keyframes beat {
        0% {
          -webkit-transform: scale(1) rotate(225deg);
          -webkit-box-shadow: 0 0 40px rgba(213, 9, 60, 1);
        }
        50% {
          -webkit-transform: scale(1.1) rotate(225deg);
          -webkit-box-shadow: 0 0 70px rgba(213, 9, 60, 0.6);
        }
        100% {
          -webkit-transform: scale(1) rotate(225deg);
          -webkit-box-shadow: 0 0 40px rgba(213, 9, 60, 1);
        }
      }
      @-moz-keyframes beat {
        0% {
          -moz-transform: scale(1) rotate(225deg);
          -moz-box-shadow: 0 0 40px rgba(213, 9, 60, 1);
        }
        50% {
          -moz-transform: scale(1.1) rotate(225deg);
          -moz-box-shadow: 0 0 70px rgba(213, 9, 60, 0.6);
        }
        100% {
          -moz-transform: scale(1) rotate(225deg);
          -moz-box-shadow: 0 0 40px rgba(213, 9, 60, 1);
        }
      }
      @keyframes beat {
        0% {
          transform: scale(1) rotate(225deg);
          box-shadow: 0 0 40px #d5093c;
        }
        50% {
          transform: scale(1.1) rotate(225deg);
          box-shadow: 0 0 70px #d5093c;
        }
        100% {
          transform: scale(1) rotate(225deg);
          box-shadow: 0 0 40px #d5093c;
        }
      }

      /*
       * Animation: justBeat
       * Purpose: Creates a pulsing effect without rotation, used for the text overlay.
       *
       * Keyframes:
       * - 0%: Normal scale.
       * - 50%: Scaled up (1.1), larger shadow.
       * - 100%: Return to start.
       */
      @-webkit-keyframes justBeat {
        0% {
          -webkit-transform: scale(1);
          -webkit-box-shadow: 0 0 40px rgba(213, 9, 60, 1);
        }
        50% {
          -webkit-transform: scale(1.1);
          -webkit-box-shadow: 0 0 70px rgba(213, 9, 60, 0.6);
        }
        100% {
          -webkit-transform: scale(1);
          -webkit-box-shadow: 0 0 40px rgba(213, 9, 60, 1);
        }
      }
      @-moz-keyframes justBeat {
        0% {
          -moz-transform: scale(1);
          -moz-box-shadow: 0 0 40px rgba(213, 9, 60, 1);
        }
        50% {
          -moz-transform: scale(1.1);
          -moz-box-shadow: 0 0 70px rgba(213, 9, 60, 0.6);
        }
        100% {
          -moz-transform: scale(1);
          -moz-box-shadow: 0 0 40px rgba(213, 9, 60, 1);
        }
      }
      @keyframes justBeat {
        0% {
          transform: scale(1);
          box-shadow: 0 0 40px #d5093c;
        }
        50% {
          transform: scale(1.1);
          box-shadow: 0 0 70px #d5093c;
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 40px #d5093c;
        }
      }

      /*
       * ID: #background
       * Purpose: Sets a fixed full-screen gradient background.
       */
      #background {
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
        /* width: 100%;
        height: 100%; */
        background: #ffa5a5;
        background: -moz-linear-gradient(top, #ffa5a5 0%, #ffd3d3 100%);
        background: -webkit-gradient(
          linear,
          left top,
          left bottom,
          color-stop(0%, #ffa5a5),
          color-stop(100%, #ffd3d3)
        );
        background: -webkit-linear-gradient(top, #ffa5a5 0%, #ffd3d3 100%);
        background: linear-gradient(top, #ffa5a5 0%, #ffd3d3 100%);
      }

      /*
       * ID: #chest
       * Purpose: Container for the heart elements, centered on the page.
       */
      #chest {
        position: relative;
        width: 500px;
        height: 450px;
        /* width: 500px;
        height: 450px; */
        margin: 0 auto;
      }

      /*
       * Class: .heart
       * Purpose: Defines the basic shape and animation for heart components.
       */
      .heart {
        position: absolute;
        z-index: 2;
        background: -moz-linear-gradient(-180deg, #f50a45 0%, #d5093c 40%);
        background: -webkit-gradient(
          linear,
          right 50%,
          left 50%,
          color-stop(0%, #f50a45),
          color-stop(40%, #d5093c)
        );
        background: -webkit-linear-gradient(-180deg, #f50a45 0%, #d5093c 40%);
        background: linear-gradient(-180deg, #f50a45 0%, #d5093c 40%);
        -webkit-animation: beat 0.7s ease 0s infinite normal;
        -moz-animation: beat 0.7s ease 0s infinite normal;
        animation: beat 0.7s ease 0s infinite normal;
      }

      /*
       * Class: .heart.center
       * Purpose: Styles the central part of the heart.
       */
      .heart.center {
        background: -moz-linear-gradient(-45deg, #b80734 0%, #d5093c 40%);
        background: -webkit-gradient(
          linear,
          left top,
          right bottom,
          color-stop(0%, #b80734),
          color-stop(40%, #d5093c)
        );
        background: -webkit-linear-gradient(-45deg, #b80734 0%, #d5093c 40%);
        background: linear-gradient(-45deg, #b80734 0%, #d5093c 40%);
      }

      /*
       * Class: .heart.top
       * Purpose: Ensures the top parts of the heart are layered correctly.
       */
      .heart.top {
        z-index: 3;
      }

      /*
       * Class: .side
       * Purpose: Creates the rounded sides of the heart using border-radius.
       */
      .side {
        top: 50px;
        width: 220px;
        height: 220px;
        -moz-border-radius: 220px;
        -webkit-border-radius: 220px;
        border-radius: 220px;
      }

      /*
       * Class: .center
       * Purpose: Styles the square center part of the heart that connects the sides.
       */
      .center {
        width: 210px;
        height: 210px;
        bottom: 100px;
        left: 145px;
        font-size: 0;
        text-indent: -9999px;
      }

      /*
       * Class: .left
       * Purpose: Positions the left lobe of the heart.
       */
      .left {
        left: 62px;
      }

      /*
       * Class: .right
       * Purpose: Positions the right lobe of the heart.
       */
      .right {
        right: 62px;
      }

      /*
       * Class: .text
       * Purpose: Styles and animates the text overlay (day counter).
       */
      .text {
        position: absolute;
        margin: 125px 200px;
        z-index: 9;
        /* font-size: 50px; */
        text-align: center;
        color: #fff;
        /* line-height: 80px; */
        font-size: 5rem;
        font-family: "Tangerine", cursive;
        -webkit-animation: justBeat 0.7s ease 0s infinite normal;
        -moz-animation: justBeat 0.7s ease 0s infinite normal;
        animation: justBeat 0.7s ease 0s infinite normal;
      }

      .text span {
        font-size: 25px;
      }
    </style>
  </head>
  <body>
    <!-- <div id="background"></div> -->
    <div id="chest">
      <div class="heart left side top"></div>
      <div class="heart center">&hearts;ddd</div>
      <div class="text"><br />16 days</div>
      <div class="heart right side"></div>
    </div>
    <script>
      /**
       * The number of milliseconds in one day.
       * Calculated as: 24 hours * 60 minutes * 60 seconds * 1000 milliseconds.
       * @type {number}
       */
      const oneDay = 24 * 60 * 60 * 1000;

      /**
       * The start date for the counter.
       * Set to December 27, 2021.
       * @type {Date}
       */
      const firstDate = new Date(2021, 11, 27);

      /**
       * The current date used for comparison.
       * initialized to the current moment, then reset to midnight (00:00:00) to ignore time of day.
       * @type {Date}
       */
      const secondDate = new Date();
      secondDate.setHours(0, 0, 0, 0);

      /**
       * The absolute difference in days between the current date and the start date.
       * @type {number}
       */
      const diffDays = Math.round(Math.abs((secondDate - firstDate) / oneDay));

      // Update the DOM element with class "text" to display the calculated day difference.
      document.getElementsByClassName("text")[0].innerHTML = diffDays + " days";
    </script>
  </body>
</html>
